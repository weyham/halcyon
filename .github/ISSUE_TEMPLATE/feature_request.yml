name: 功能建议
description: 希望代理新增的能力
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue 避免重复；描述「要解决什么问题」比「具体怎么做」更有用。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前什么行为让你不便？影响是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的形态
      description: 你希望的解决方式（可选）
    validations:
      required: false
  - type: input
    id: context
    attributes:
      label: 使用场景
      placeholder: 例如：Windows + Codex 桌面版 + Kimi 路由
    validations:
      required: false
