[package]
name = "halcyon-app"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
publish = false
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "halcyon_app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0" }

[dependencies]
halcyon-core = { path = "../core" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.10"
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.6"
tauri-plugin-notification = "2"
velopack = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[dev-dependencies]
async-trait = "0.1"





[[bin]]
name = "halcyon"
path = "src/main.rs"


[features]
# 生产构建（tauri build / cargo build --release --features custom-protocol）启用：
custom-protocol = ["tauri/custom-protocol"]













